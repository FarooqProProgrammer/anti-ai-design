</text>
<rect x="50" y="120" width="250" height="110" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="2" />
<text x="65" y="150" font-size="15" fill="#212529" font-weight="normal">
  <tspan x="65" dy="0">1. INGEST &amp; SCOPE</tspan>
</text>
<text x="65" y="172" font-size="12" fill="#495057" font-weight="normal">
