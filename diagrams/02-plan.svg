</text>
<text x="365" y="172" font-size="12" fill="#495057" font-weight="normal">
  <tspan x="365" dy="0">• Failure mode analysis</tspan>
  <tspan x="365" dy="15.600000000000001px">• Concurrency &amp; race hazards</tspan>
  <tspan x="365" dy="15.600000000000001px">• Mitigation for each risk</tspan>
</text>
