</text>
<text x="665" y="172" font-size="12" fill="#495057" font-weight="normal">
  <tspan x="665" dy="0">• Given-When-Then criteria</tspan>
  <tspan x="665" dy="15.600000000000001px">• Edge-case assertions</tspan>
  <tspan x="665" dy="15.600000000000001px">• 100% testable conditions</tspan>
</text>
