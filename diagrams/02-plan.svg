<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 997 540" width="997" height="540" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
