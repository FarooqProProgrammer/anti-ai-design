<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 930 540" width="930" height="540" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#495057" /></marker>
  <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e03131" /></marker>
  <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1971c2" /></marker>
  <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f9e44" /></marker>
</defs>
<rect x="50" y="30" width="860" height="70" rx="8" fill="#f8f9fa" stroke="#343a40" stroke-width="2" />
<text x="75" y="64" font-size="20" fill="#212529" font-weight="bold">
  <tspan x="75" dy="0">STEP 3: IMPLEMENT — Single Driver Principle &amp; Scoped Refinement</tspan>
</text>
<text x="75" y="85" font-size="13" fill="#6c757d" font-weight="normal">
  <tspan x="75" dy="0">Firewall Gate 3 | Applicable: Cursor, Claude Code, or Codex</tspan>
</text>
<rect x="50" y="120" width="400" height="260" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="2" />
<text x="70" y="154" font-size="16" fill="#087f5b" font-weight="bold">
  <tspan x="70" dy="0">PRIMARY DRIVER (Single Ownership)</tspan>
</text>
<text x="70" y="180" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="70" dy="0">Assigned Agent: Cursor, Claude Code, or Codex</tspan>
  <tspan x="70" dy="15.600000000000001px"></tspan>
  <tspan x="70" dy="15.600000000000001px">• Owns core business logic &amp; domain models</tspan>
  <tspan x="70" dy="15.600000000000001px">• Drives API endpoints, schemas &amp; state store</tspan>
  <tspan x="70" dy="15.600000000000001px">• Writes unit &amp; integration tests alongside code</tspan>
  <tspan x="70" dy="15.600000000000001px">• Adheres strictly to the approved Phase 2 plan</tspan>
  <tspan x="70" dy="15.600000000000001px">• Prevents context fragmentation</tspan>
</text>
<rect x="490" y="120" width="415" height="260" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" />
<text x="510" y="154" font-size="16" fill="#1864ab" font-weight="bold">
  <tspan x="510" dy="0">INTERACTIVE &amp; FRONTEND REFINEMENT</tspan>
</text>
<text x="510" y="180" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="510" dy="0">Assigned Agent: Cursor (or Primary Driver)</tspan>
  <tspan x="510" dy="15.600000000000001px"></tspan>
  <tspan x="510" dy="15.600000000000001px">• Scoped visual tweaks: CSS, Tailwind, layouts</tspan>
  <tspan x="510" dy="15.600000000000001px">• Interactive UI states: hover, focus, animations</tspan>
  <tspan x="510" dy="15.600000000000001px">• Real-time inline edits requested by engineer</tspan>
  <tspan x="510" dy="15.600000000000001px">• BOUNDARY: Does NOT alter core domain logic</tspan>
  <tspan x="510" dy="15.600000000000001px">• Maintains contract with Primary Driver</tspan>
</text>
<line x1="450" y1="250" x2="490" y2="250" stroke="#0ca678" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="50" y="420" width="855" height="80" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="2" />
<text x="70" y="447" font-size="15" fill="#212529" font-weight="normal">
  <tspan x="70" dy="0">IMPLEMENTATION HYGIENE PROTOCOL</tspan>
</text>
<text x="70" y="470" font-size="12" fill="#495057" font-weight="normal">
  <tspan x="70" dy="0">No speculative code • No unapproved refactoring • Atomic changes matching plan milestones.</tspan>
</text>
</svg>