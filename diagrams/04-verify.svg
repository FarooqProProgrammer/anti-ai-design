<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 930 530" width="930" height="530" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
