<rect x="50" y="30" width="860" height="70" fill="#f8f9fa" stroke="#343a40" stroke-width="2" rx="8" />
<text x="75" y="64" font-size="20" fill="#212529" font-weight="bold">
  <tspan x="75" dy="0">STEP 2: SPEC — Technical &amp; Functional Specification</tspan>
</text>
<text x="75" y="85" font-size="13" fill="#6c757d" font-weight="normal">
  <tspan x="75" dy="0">Firewall Gate 2 | Applicable: Any Agent (Cursor / Claude / Codex)</tspan>
</text>
<rect x="50" y="120" width="265" height="320" fill="#f3f0ff" stroke="#7950f2" stroke-width="2" rx="8" />
<text x="65" y="150" font-size="15" fill="#5f3dc4" font-weight="normal">
  <tspan x="65" dy="0">1. FUNCTIONAL SPEC</tspan>
</text>
<text x="65" y="177" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="65" dy="0">• User Journeys &amp; Workflows</tspan>
  <tspan x="65" dy="15.600000000000001px">• Behavioral Invariants</tspan>
  <tspan x="65" dy="15.600000000000001px">• Input / Output Contracts</tspan>
  <tspan x="65" dy="15.600000000000001px">• State Machine Transitions</tspan>
  <tspan x="65" dy="15.600000000000001px">• UI / UX Interactions</tspan>
  <tspan x="65" dy="15.600000000000001px">• Explicit Non-Features</tspan>
</text>
<rect x="345" y="120" width="265" height="320" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" rx="8" />
<text x="360" y="150" font-size="15" fill="#1864ab" font-weight="normal">
  <tspan x="360" dy="0">2. DATA &amp; API SCHEMAS</tspan>
</text>
<text x="360" y="177" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="360" dy="0">• TypeScript Types &amp; Schemas</tspan>
  <tspan x="360" dy="15.600000000000001px">• Database Entity Models</tspan>
  <tspan x="360" dy="15.600000000000001px">• API Payloads &amp; Status Codes</tspan>
  <tspan x="360" dy="15.600000000000001px">• Error Response Formats</tspan>
  <tspan x="360" dy="15.600000000000001px">• External RFCs into raw/</tspan>
  <tspan x="360" dy="15.600000000000001px">• Grounded in wiki/</tspan>
</text>
<rect x="640" y="120" width="265" height="320" fill="#fff9db" stroke="#f59f00" stroke-width="2" rx="8" />
<text x="655" y="150" font-size="15" fill="#f08c00" font-weight="normal">
  <tspan x="655" dy="0">3. SYSTEM GUARDRAILS</tspan>
</text>
<text x="655" y="177" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="655" dy="0">• Latency &amp; Performance Budgets</tspan>
  <tspan x="655" dy="15.600000000000001px">• Security &amp; Auth Requirements</tspan>
  <tspan x="655" dy="15.600000000000001px">• Concurrency Invariants</tspan>
  <tspan x="655" dy="15.600000000000001px">• Backward Compatibility</tspan>
  <tspan x="655" dy="15.600000000000001px">• Breaking Change Policies</tspan>
  <tspan x="655" dy="15.600000000000001px">• Rate Limits &amp; Scaling</tspan>
</text>
