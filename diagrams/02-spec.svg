<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 1080 610" width="1080" height="610" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
