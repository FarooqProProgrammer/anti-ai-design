<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 940 605" width="940" height="605" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#495057" /></marker>
  <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e03131" /></marker>
  <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1971c2" /></marker>
  <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f9e44" /></marker>
</defs>
<rect x="50" y="30" width="860" height="70" fill="#f8f9fa" stroke="#343a40" stroke-width="2" rx="8" />
<text x="75" y="64" font-size="20" fill="#212529" font-weight="bold">
  <tspan x="75" dy="0">STEP 4: IMPLEMENT — Single Driver, Loop Gate &amp; Parallel Agents</tspan>
</text>
<text x="75" y="85" font-size="13" fill="#6c757d" font-weight="normal">
  <tspan x="75" dy="0">Firewall Gate 4 | Loop: Implement ➔ Spec ➔ Plan ➔ Implement | /find-skills &amp; Parallel Dispatch</tspan>
</text>
<rect x="50" y="115" width="410" height="160" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" rx="8" />
<text x="70" y="145" font-size="15" fill="#1864ab" font-weight="normal">
  <tspan x="70" dy="0">PRIMARY DRIVER (Sole Logic Owner)</tspan>
</text>
<text x="70" y="169" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="70" dy="0">• Cursor, Claude Code, or Codex</tspan>
  <tspan x="70" dy="15.600000000000001px">• Owns core business logic &amp; domain</tspan>
  <tspan x="70" dy="15.600000000000001px">• Builds unit &amp; integration tests alongside</tspan>
  <tspan x="70" dy="15.600000000000001px">• Follows approved plan sequentially</tspan>
  <tspan x="70" dy="15.600000000000001px">• Prevents multi-driver context drift</tspan>
</text>
<rect x="495" y="115" width="410" height="160" fill="#fff4e6" stroke="#f76707" stroke-width="2" rx="8" />
<text x="515" y="145" font-size="15" fill="#d9480f" font-weight="normal">
  <tspan x="515" dy="0">FRONTEND / INTERACTIVE POLISH</tspan>
</text>
<text x="515" y="169" font-size="12" fill="#343a40" font-weight="normal">
  <tspan x="515" dy="0">• Cursor live inline adjustments</tspan>
  <tspan x="515" dy="15.600000000000001px">• Visual styling (Tailwind / CSS)</tspan>
  <tspan x="515" dy="15.600000000000001px">• UI component layout &amp; ergonomics</tspan>
  <tspan x="515" dy="15.600000000000001px">• Keyboard accessibility &amp; ARIA</tspan>
  <tspan x="515" dy="15.600000000000001px">• Clean surgical diffs</tspan>
</text>
<line x1="460" y1="195" x2="495" y2="195" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowhead-blue)" />
<line x1="495" y1="215" x2="460" y2="215" stroke="#f76707" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="50" y="295" width="855" height="175" fill="#f3f0ff" stroke="#7950f2" stroke-width="2" rx="8" />
<text x="70" y="324" font-size="15" fill="#5f3dc4" font-weight="normal">
  <tspan x="70" dy="0">🔄 THE IMPLEMENTATION LOOP GATE: SUB-TASK DECOMPOSITION &amp; PARALLEL DISPATCH</tspan>
</text>
<text x="70" y="345" font-size="12" fill="#495057" font-weight="normal">
  <tspan x="70" dy="0">Trigger: When implementation reveals multiple decoupled sub-modules, independent tasks, or missing skills:</tspan>
</text>
<rect x="70" y="357" width="260" height="95" fill="#fff9db" stroke="#f59f00" stroke-width="1" rx="8" />
<text x="80" y="380" font-size="13" fill="#f08c00" font-weight="normal">
  <tspan x="80" dy="0">1. /find-skills DISCOVERY</tspan>
</text>
<text x="80" y="400" font-size="11" fill="#495057" font-weight="normal">
  <tspan x="80" dy="0">• npx skills find &lt;domain&gt;</tspan>
  <tspan x="80" dy="14.3px">• Leaderboard on skills.sh</tspan>
  <tspan x="80" dy="14.3px">• Equip missing tools/skills</tspan>
  <tspan x="80" dy="14.3px">• Ready specialized capabilities</tspan>
</text>
<line x1="330" y1="405" x2="365" y2="405" stroke="#7950f2" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="365" y="357" width="260" height="95" fill="#e6fcf5" stroke="#0ca678" stroke-width="1" rx="8" />
<text x="375" y="380" font-size="13" fill="#099268" font-weight="normal">
  <tspan x="375" dy="0">2. PARALLEL AGENTS</tspan>
</text>
<text x="375" y="400" font-size="11" fill="#495057" font-weight="normal">
  <tspan x="375" dy="0">• Dispatch parallel subagents</tspan>
  <tspan x="375" dy="14.3px">• Independent work streams</tspan>
  <tspan x="375" dy="14.3px">• Backend vs UI vs DB models</tspan>
  <tspan x="375" dy="14.3px">• Single Driver orchestrates</tspan>
</text>
<line x1="625" y1="405" x2="660" y2="405" stroke="#0ca678" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="660" y="357" width="260" height="95" fill="#e7f5ff" stroke="#1971c2" stroke-width="1" rx="8" />
<text x="670" y="380" font-size="13" fill="#1864ab" font-weight="normal">
  <tspan x="670" dy="0">3. LOOP: SPEC ➔ PLAN ➔ IMPL</tspan>
</text>
<text x="670" y="400" font-size="11" fill="#495057" font-weight="normal">
  <tspan x="670" dy="0">• Sub-Spec: contracts &amp; schemas</tspan>
  <tspan x="670" dy="14.3px">• Sub-Plan: testable criteria</tspan>
  <tspan x="670" dy="14.3px">• Implement with zero drift</tspan>
  <tspan x="670" dy="14.3px">• Re-integrate to Primary Driver</tspan>
</text>
<rect x="50" y="490" width="855" height="75" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" rx="8" />
<text x="70" y="516" font-size="14" fill="#2b8a3e" font-weight="normal">
  <tspan x="70" dy="0">INVARIANT: NO PARALLEL STREAM CODE WITHOUT SPEC &amp; PLAN APPROVAL</tspan>
</text>
<text x="70" y="538" font-size="12" fill="#495057" font-weight="normal">
  <tspan x="70" dy="0">Primary Driver merges parallel streams cleanly, reviews diffs, and enforces quality gates before Phase 5 Verify.</tspan>
</text>
</svg>