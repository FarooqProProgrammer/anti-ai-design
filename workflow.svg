<rect x="50" y="30" width="1120" height="70" fill="#f8f9fa" stroke="#343a40" stroke-width="2" rx="8" />
<text x="75" y="64" font-size="20" fill="#212529" font-weight="bold">
  <tspan x="75" dy="0">UNIVERSAL 7-PHASE AI ENGINEERING WORKFLOW</tspan>
</text>
<text x="75" y="85" font-size="13" fill="#6c757d" font-weight="normal">
  <tspan x="75" dy="0">Request Firewall Admission &amp; Quality Gates | Agent-Universal (Cursor, Claude Code, Codex, Antigravity)</tspan>
</text>
<rect x="50" y="115" width="1120" height="65" fill="#fff9db" stroke="#f59f00" stroke-width="2" rx="8" />
<text x="70" y="142" font-size="15" fill="#f08c00" font-weight="normal">
  <tspan x="70" dy="0">🛡️ PRE-ADMISSION: CONTRADICTION CHECK</tspan>
</text>
<text x="70" y="162" font-size="12" fill="#495057" font-weight="normal">
  <tspan x="70" dy="0">Match input with wiki/ &amp; docs -&gt; If contradictory, HALT &amp; RETURN conflict. Only proceed if consistent or clarified.</tspan>
</text>
<rect x="50" y="200" width="145" height="220" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" rx="8" />
<text x="60" y="228" font-size="13" fill="#1971c2" font-weight="normal">
  <tspan x="60" dy="0">1. UNDERSTAND</tspan>
</text>
<text x="60" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="60" dy="0">• Brainstorming</tspan>
  <tspan x="60" dy="14.3px">• Grill-Me interview</tspan>
  <tspan x="60" dy="14.3px">• Code exploration</tspan>
  <tspan x="60" dy="14.3px">• wiki/ &amp; cursor log</tspan>
  <tspan x="60" dy="14.3px">• READ-ONLY</tspan>
</text>
<line x1="195" y1="310" x2="213" y2="310" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowhead-blue)" />
<rect x="213" y="200" width="145" height="220" fill="#f3f0ff" stroke="#7950f2" stroke-width="2" rx="8" />
<text x="223" y="228" font-size="13" fill="#7950f2" font-weight="normal">
  <tspan x="223" dy="0">2. SPEC</tspan>
</text>
<text x="223" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="223" dy="0">• Functional Spec</tspan>
  <tspan x="223" dy="14.3px">• Technical contracts</tspan>
  <tspan x="223" dy="14.3px">• API &amp; Data schemas</tspan>
  <tspan x="223" dy="14.3px">• Non-functional limits</tspan>
  <tspan x="223" dy="14.3px">• Sign-off WHAT</tspan>
</text>
<line x1="358" y1="310" x2="376" y2="310" stroke="#7950f2" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="376" y="200" width="145" height="220" fill="#fff4e6" stroke="#f76707" stroke-width="2" rx="8" />
<text x="386" y="228" font-size="13" fill="#f76707" font-weight="normal">
  <tspan x="386" dy="0">3. PLAN</tspan>
</text>
<text x="386" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="386" dy="0">• Risk &amp; mitigations</tspan>
  <tspan x="386" dy="14.3px">• Given-When-Then AC</tspan>
  <tspan x="386" dy="14.3px">• Phased milestones</tspan>
  <tspan x="386" dy="14.3px">• Single driver pick</tspan>
  <tspan x="386" dy="14.3px">• Sign-off HOW</tspan>
</text>
<line x1="521" y1="310" x2="539" y2="310" stroke="#f76707" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="539" y="200" width="145" height="220" fill="#e6fcf5" stroke="#0ca678" stroke-width="2" rx="8" />
<text x="549" y="228" font-size="13" fill="#0ca678" font-weight="normal">
  <tspan x="549" dy="0">4. IMPLEMENT</tspan>
</text>
<text x="549" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="549" dy="0">• Single Driver owner</tspan>
  <tspan x="549" dy="14.3px">• Loop: Spec➔Plan➔Impl</tspan>
  <tspan x="549" dy="14.3px">• /find-skills for gaps</tspan>
  <tspan x="549" dy="14.3px">• Dispatch parallel</tspan>
  <tspan x="549" dy="14.3px">• Plan fidelity</tspan>
</text>
<line x1="684" y1="310" x2="702" y2="310" stroke="#0ca678" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="702" y="200" width="145" height="220" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" rx="8" />
<text x="712" y="228" font-size="13" fill="#2f9e44" font-weight="normal">
  <tspan x="712" dy="0">5. VERIFY</tspan>
</text>
<text x="712" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="712" dy="0">• Automated gates</tspan>
  <tspan x="712" dy="14.3px">• Risk-tiered checks</tspan>
  <tspan x="712" dy="14.3px">• High-risk scrutiny</tspan>
  <tspan x="712" dy="14.3px">• Evidence report</tspan>
  <tspan x="712" dy="14.3px">• Zero concealment</tspan>
</text>
<line x1="847" y1="310" x2="865" y2="310" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead-green)" />
<rect x="865" y="200" width="145" height="220" fill="#ffe3e3" stroke="#e03131" stroke-width="2" rx="8" />
<text x="875" y="228" font-size="13" fill="#e03131" font-weight="normal">
  <tspan x="875" dy="0">6. REVIEW</tspan>
</text>
<text x="875" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="875" dy="0">• Fresh context audit</tspan>
  <tspan x="875" dy="14.3px">• Final git diff check</tspan>
  <tspan x="875" dy="14.3px">• Security &amp; bugs</tspan>
  <tspan x="875" dy="14.3px">• REVIEW ONLY</tspan>
  <tspan x="875" dy="14.3px">• Driver fixes</tspan>
</text>
<line x1="1010" y1="310" x2="1028" y2="310" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)" />
<rect x="1028" y="200" width="145" height="220" fill="#f8f9fa" stroke="#343a40" stroke-width="2" rx="8" />
<text x="1038" y="228" font-size="13" fill="#343a40" font-weight="normal">
  <tspan x="1038" dy="0">7. SHIP SAFELY</tspan>
</text>
<text x="1038" y="256" font-size="11" fill="#343a40" font-weight="normal">
  <tspan x="1038" dy="0">• Clean git status</tspan>
  <tspan x="1038" dy="14.3px">• Feature branch only</tspan>
  <tspan x="1038" dy="14.3px">• Conventional commit</tspan>
  <tspan x="1038" dy="14.3px">• CI/CD pass</tspan>
  <tspan x="1038" dy="14.3px">• Compound wiki/</tspan>
</text>
<rect x="50" y="440" width="1120" height="80" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="8" />
<text x="70" y="466" font-size="14" fill="#099268" font-weight="normal">
  <tspan x="70" dy="0">🔄 IMPLEMENTATION LOOP GATE (Implement ➔ Loop ➔ Spec ➔ Plan ➔ Implement)</tspan>
</text>
<text x="70" y="488" font-size="11" fill="#495057" font-weight="normal">
  <tspan x="70" dy="0">If multiple tasks or domain gaps emerge: /find-skills installs missing tools ➔ Dispatch parallel agents ➔ Each follows Spec ➔ Plan ➔ Implement under Single Driver.</tspan>
</text>
</svg>