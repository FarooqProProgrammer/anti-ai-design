<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 1070 1860" width="1070" height="1860" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
  </marker>
  <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#e03131" />
  </marker>
  <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2" />
  </marker>
  <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#f76707" />
  </marker>
  <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2f9e44" />
  </marker>
</defs>
<rect x="400" y="20" width="360" height="40" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2" />
<text x="440" y="45" font-size="15" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="440" dy="0">INCOMING USER REQUEST / TASK</tspan>
</text>
<line x1="580" y1="60" x2="580" y2="90" stroke="#d9480f" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="280" y="90" width="600" height="90" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="3" />
<text x="350" y="122" font-size="20" fill="#c92a2a" font-weight="bold" text-anchor="start">
  <tspan x="350" dy="0">🛡️ MANDATORY AI REQUEST FIREWALL</tspan>
</text>
<text x="310" y="143" font-size="11" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="310" dy="0">Universal Workflow: Any agent (Cursor / Claude / Codex) can run all steps.</tspan>
  <tspan x="310" dy="14.3px">Every task must proceed sequentially: Understand ➔ Plan ➔ Implement ➔ Verify ➔ Review ➔ Ship.</tspan>
</text>
<line x1="580" y1="180" x2="580" y2="220" stroke="#1971c2" stroke-width="3" marker-end="url(#arrowhead-blue)" />
<rect x="310" y="220" width="540" height="140" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" />
<text x="330" y="252" font-size="18" fill="#1971c2" font-weight="bold" text-anchor="start">
  <tspan x="330" dy="0">PHASE 1: UNDERSTAND</tspan>
</text>
<rect x="697" y="232" width="133" height="24" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1" />
<text x="705" y="246" font-size="11" fill="#1971c2" font-weight="normal" text-anchor="start">
  <tspan x="705" dy="0">GATE 1: RECON</tspan>
</text>
<text x="330" y="275" font-size="13" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">Agent: Any Agent (Cursor / Claude / Codex / Antigravity)</tspan>
</text>
<text x="330" y="298" font-size="12" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">• Explore relevant code &amp; trace dependencies</tspan>
  <tspan x="330" dy="15.600000000000001px">• Identify existing codebase patterns &amp; idioms</tspan>
  <tspan x="330" dy="15.600000000000001px">• Consult wiki/index.md for prior decisions</tspan>
  <tspan x="330" dy="15.600000000000001px">• FIREWALL GATE: Read-only — zero code edits</tspan>
</text>
<line x1="580" y1="360" x2="580" y2="420" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowhead-blue)" />
<rect x="310" y="420" width="540" height="140" rx="8" fill="#fff4e6" stroke="#f76707" stroke-width="2" />
<text x="330" y="452" font-size="18" fill="#f76707" font-weight="bold" text-anchor="start">
  <tspan x="330" dy="0">PHASE 2: PLAN</tspan>
</text>
<rect x="670" y="432" width="160" height="24" rx="8" fill="#ffe8cc" stroke="#f76707" stroke-width="1" />
<text x="678" y="446" font-size="11" fill="#f76707" font-weight="normal" text-anchor="start">
  <tspan x="678" dy="0">GATE 2: APPROVAL</tspan>
</text>
<text x="330" y="475" font-size="13" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">Agent: Any Agent (Cursor / Claude / Codex / Antigravity)</tspan>
</text>
<text x="330" y="498" font-size="12" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">• Investigate complex requirements &amp; failure modes</tspan>
  <tspan x="330" dy="15.600000000000001px">• Ingest external RFCs/specs into raw/ &amp; compile wiki/</tspan>
  <tspan x="330" dy="15.600000000000001px">• Produce testable Acceptance Criteria (Given-When-Then)</tspan>
  <tspan x="330" dy="15.600000000000001px">• FIREWALL GATE: Explicit approval before coding starts</tspan>
</text>
<line x1="580" y1="560" x2="580" y2="620" stroke="#f76707" stroke-width="2" marker-end="url(#arrowhead-orange)" />
<rect x="310" y="620" width="540" height="140" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="2" />
<text x="330" y="652" font-size="18" fill="#0ca678" font-weight="bold" text-anchor="start">
  <tspan x="330" dy="0">PHASE 3: IMPLEMENT</tspan>
</text>
<rect x="625" y="632" width="205" height="24" rx="8" fill="#c3fae8" stroke="#0ca678" stroke-width="1" />
<text x="633" y="646" font-size="11" fill="#0ca678" font-weight="normal" text-anchor="start">
  <tspan x="633" dy="0">GATE 3: SINGLE DRIVER</tspan>
</text>
<text x="330" y="675" font-size="13" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">Agent: Primary Driver (Cursor, Claude Code, or Codex)</tspan>
</text>
<text x="330" y="698" font-size="12" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">• Primary Driver owns core logic &amp; domain models</tspan>
  <tspan x="330" dy="15.600000000000001px">• Cursor or driver handles interactive edits &amp; frontend</tspan>
  <tspan x="330" dy="15.600000000000001px">• FIREWALL GATE: Single Driver principle strictly enforced</tspan>
</text>
<line x1="580" y1="760" x2="580" y2="820" stroke="#0ca678" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="310" y="820" width="540" height="140" rx="8" fill="#fff9db" stroke="#f59f00" stroke-width="2" />
<text x="330" y="852" font-size="18" fill="#f59f00" font-weight="bold" text-anchor="start">
  <tspan x="330" dy="0">PHASE 4: VERIFY</tspan>
</text>
<rect x="652" y="832" width="178" height="24" rx="8" fill="#ffec99" stroke="#f59f00" stroke-width="1" />
<text x="660" y="846" font-size="11" fill="#f59f00" font-weight="normal" text-anchor="start">
  <tspan x="660" dy="0">GATE 4: 100% GREEN</tspan>
</text>
<text x="330" y="875" font-size="13" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">Agent: Any Agent + Test Runner / Environment</tspan>
</text>
<text x="330" y="898" font-size="12" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">• Run full typecheck, linter &amp; test suites</tspan>
  <tspan x="330" dy="15.600000000000001px">• Validate actual runtime flow vs Acceptance Criteria</tspan>
  <tspan x="330" dy="15.600000000000001px">• Run check_evidence.py (Wiki Grounding)</tspan>
  <tspan x="330" dy="15.600000000000001px">• FIREWALL GATE: Zero concealment — capture all failures</tspan>
</text>
<line x1="580" y1="960" x2="580" y2="1020" stroke="#f59f00" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="310" y="1020" width="540" height="140" rx="8" fill="#f3f0ff" stroke="#7950f2" stroke-width="2" />
<text x="330" y="1052" font-size="18" fill="#7950f2" font-weight="bold" text-anchor="start">
  <tspan x="330" dy="0">PHASE 5: REVIEW INDEPENDENTLY</tspan>
</text>
<rect x="652" y="1032" width="178" height="24" rx="8" fill="#e5dbff" stroke="#7950f2" stroke-width="1" />
<text x="660" y="1046" font-size="11" fill="#7950f2" font-weight="normal" text-anchor="start">
  <tspan x="660" dy="0">GATE 5: AUDIT DIFF</tspan>
</text>
<text x="330" y="1075" font-size="13" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">Agent: Auditor (Clean Context / Second Agent Instance)</tspan>
</text>
<text x="330" y="1098" font-size="12" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">• Audit full git diff for logic, security &amp; regressions</tspan>
  <tspan x="330" dy="15.600000000000001px">• FIREWALL GATE: Review without editing (Read-only)</tspan>
  <tspan x="330" dy="15.600000000000001px">• Confirmed findings triaged &amp; fixed by Driver</tspan>
</text>
<line x1="580" y1="1160" x2="580" y2="1220" stroke="#7950f2" stroke-width="2" marker-end="url(#arrowhead)" />
<rect x="310" y="1220" width="540" height="140" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" />
<text x="330" y="1252" font-size="18" fill="#2f9e44" font-weight="bold" text-anchor="start">
  <tspan x="330" dy="0">PHASE 6: SHIP SAFELY</tspan>
</text>
<rect x="688" y="1232" width="142" height="24" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1" />
<text x="696" y="1246" font-size="11" fill="#2f9e44" font-weight="normal" text-anchor="start">
  <tspan x="696" dy="0">GATE 6: DEPLOY</tspan>
</text>
<text x="330" y="1275" font-size="13" fill="#212529" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">Agent: Any Agent + Lead Engineer</tspan>
</text>
<text x="330" y="1298" font-size="12" fill="#495057" font-weight="normal" text-anchor="start">
  <tspan x="330" dy="0">• Final git diff sanity (no lingering debug code)</tspan>
  <tspan x="330" dy="15.600000000000001px">• Atomic conventional commit on feature branch</tspan>
  <tspan x="330" dy="15.600000000000001px">• PR review &amp; CI/CD pipeline verification</tspan>
  <tspan x="330" dy="15.600000000000001px">• FIREWALL GATE: Protected branches, CI green &amp; wiki compounding</tspan>
</text>
<line x1="850" y1="1090" x2="930" y2="1090" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)" />
<line x1="930" y1="1090" x2="930" y2="690" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)" />
<line x1="930" y1="690" x2="850" y2="690" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)" />
<rect x="865" y="870" width="130" height="40" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1" />
<text x="875" y="890" font-size="12" fill="#c92a2a" font-weight="normal" text-anchor="start">
  <tspan x="875" dy="0">Fix Findings</tspan>
  <tspan x="875" dy="15.600000000000001px">&amp; Re-verify</tspan>
</text>
<rect x="40" y="260" width="230" height="540" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="2" />
<text x="55" y="291" font-size="16" fill="#1e1e1e" font-weight="bold" text-anchor="start">
  <tspan x="55" dy="0">KARPATHY LLM WIKI</tspan>
</text>
<text x="55" y="312" font-size="12" fill="#868e96" font-weight="normal" text-anchor="start">
  <tspan x="55" dy="0">Compounding Knowledge</tspan>
</text>
<rect x="55" y="335" width="200" height="85" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1" />
<text x="65" y="356" font-size="11" fill="#343a40" font-weight="normal" text-anchor="start">
  <tspan x="65" dy="0">raw/</tspan>
  <tspan x="65" dy="14.3px">• Immutable Sources</tspan>
  <tspan x="65" dy="14.3px">• RFCs, Docs, Notes</tspan>
  <tspan x="65" dy="14.3px">• Read-only to agents</tspan>
</text>
<rect x="55" y="440" width="200" height="105" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1" />
<text x="65" y="461" font-size="11" fill="#343a40" font-weight="normal" text-anchor="start">
  <tspan x="65" dy="0">wiki/</tspan>
  <tspan x="65" dy="14.3px">• Compiled Articles</tspan>
  <tspan x="65" dy="14.3px">• wiki/index.md</tspan>
  <tspan x="65" dy="14.3px">• wiki/log.md</tspan>
  <tspan x="65" dy="14.3px">• Grounding Invariant</tspan>
</text>
<rect x="55" y="565" width="200" height="85" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1" />
<text x="65" y="586" font-size="11" fill="#343a40" font-weight="normal" text-anchor="start">
  <tspan x="65" dy="0">check_evidence.py</tspan>
  <tspan x="65" dy="14.3px">• Mechanical linter</tspan>
  <tspan x="65" dy="14.3px">• Verifies quotes/dates</tspan>
  <tspan x="65" dy="14.3px">• 0 suspect tolerance</tspan>
</text>
